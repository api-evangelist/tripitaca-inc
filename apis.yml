description: Tripitaca is a Kenya-based travel and hospitality booking marketplace where travelers
  get the best deals when they travel and where property owners list their properties. The platform
  lets travelers receive offers from hosts and hotels, while hosts create curated packages and special
  offers, see travelers interested in their area, and make them offers. Coverage spans destinations
  including Nairobi, Mombasa, Nakuru, Kisumu, and Maasai Mara safari experiences. Backed by 500 Global.
